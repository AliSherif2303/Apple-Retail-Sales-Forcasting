version: '3.8'

services:
  streamlit-app:
    build: .
    container_name: apple-sales-dashboard
    ports:
      - "8501:8501"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - .:/app                # app code + star-schema CSVs
      - ../data:/data         # processed forecast & sales CSVs for pages 2-6
      - ../notebooks:/notebooks  # trained model files (ADA_LIVE.joblib, CAT_LIVE.cbm)
    depends_on:
      - ollama
    networks:
      - app-network

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - app-network
    # If using GPU on the Azure VM, uncomment the following section:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

networks:
  app-network:
    driver: bridge

volumes:
  ollama_data:
